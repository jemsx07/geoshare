<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GeoShare — Live Map</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="map.css"/>
</head>
<body>

  <!-- ── TOPBAR ── -->
  <div class="topbar">
    <div class="tb-left">
      <div class="brand">
        <div class="brand-dot" id="brandDot"></div>
        GeoShare
      </div>
      <div class="live-pill" id="livePill">
        <span class="lp-dot"></span>LIVE
      </div>
    </div>
    <div class="tb-right">
      <button class="icon-btn" id="btnRecenter" title="Recenter">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
          <circle cx="12" cy="12" r="9"/>
        </svg>
      </button>
      <button class="icon-btn" id="btnCopyLink" title="Copy map link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
      </button>
      <a href="index.html" class="icon-btn" title="Permission">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </a>
    </div>
  </div>

  <!-- ── MAP ── -->
  <div id="map"></div>

  <!-- ── BOTTOM PANEL ── -->
  <div class="bottom-panel" id="bottomPanel">
    <div class="bp-row1">
      <div class="bp-label">MY POSITION</div>
      <div class="acc-tag" id="accTag">— m accuracy</div>
    </div>
    <div class="bp-coords">
      <div class="bc">
        <div class="bc-label">Latitude</div>
        <div class="bc-val" id="valLat">—</div>
      </div>
      <div class="bc-divider"></div>
      <div class="bc">
        <div class="bc-label">Longitude</div>
        <div class="bc-val" id="valLng">—</div>
      </div>
    </div>
    <div class="bp-time" id="bpTime">Waiting for GPS fix…</div>
  </div>

  <!-- ── TOAST ── -->
  <div class="toast" id="toast"></div>

  <!-- ── OVERLAY (no permission) ── -->
  <div class="perm-overlay" id="permOverlay">
    <div class="pov-card">
      <div class="pov-icon">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
      </div>
      <h2>No Location Yet</h2>
      <p>Grant location access on the permission page first to see your pin on this map.</p>
      <a href="index.html" class="pov-btn">
        Go to Permission Page
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
      <button class="pov-skip" onclick="skipOverlay()">Request GPS directly →</button>
    </div>
  </div>

  <script src="map.js"></script>
</body>
</html>
